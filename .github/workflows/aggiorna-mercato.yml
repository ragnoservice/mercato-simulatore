name: Aggiorna PUN e PSV
on:
  schedule:
    - cron: '20 5 * * *'
    - cron: '20 10 * * *'
    - cron: '20 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggiorna mercato.json
        run: python scripts/aggiorna_mercato.py
      - name: Salva se cambiato
        run: |
          if [ -n "$(git status --porcelain mercato.json)" ]; then
            git config user.name "mercato-bot"
            git config user.email "mercato-bot@users.noreply.github.com"
            git add mercato.json
            git commit -m "Aggiornamento PUN/PSV $(date -u +%F)"
            git push
          fi
